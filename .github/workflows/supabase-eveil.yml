# Garde la base Supabase éveillée (l'offre gratuite se met en pause après 7 jours sans visite).
# Une petite lecture tous les 3 jours. À installer une fois : voir MISE-EN-PLACE.md, étape 8.
name: Supabase éveillé

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Petite lecture dans la base
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Ajoute les secrets SUPABASE_URL et SUPABASE_KEY (Settings > Secrets and variables > Actions)."; exit 1
          fi
          curl -sSf "$SUPABASE_URL/rest/v1/agency?select=id&limit=1" -H "apikey: $SUPABASE_KEY" -o /dev/null -w "Supabase a répondu : %{http_code}\n"
